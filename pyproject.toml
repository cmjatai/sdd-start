[project]
name = "sdd-start"
version = "0.1.0"
description = "Backend 0.1"
authors = [
    {name = "LeandroJatai",email = "leandroroberto.br@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false


[tool.poetry.dependencies] 
django = ">=6,<7.0"
daphne = "^4.2.3"
channels = "^4.3.2"
channels-redis = "^4.3.0"
django-vite = "^3.2.0"
django-extensions = "^4.1"
python-decouple = "^3.8"
gunicorn = "^26.2.0"
kazoo = "^2.11.0"
twisted = {extras = ["http2", "tls"], version = "^26.10.0"}
redis = "^8.1.0"
celery = "^5.6.3"
django-celery-beat = "^2.9.0"
django-celery-results = "^2.6.0"
psycopg = {extras = ["pool"], version = "^3.3.8"}
dj-database-url = "^3.1.2"
ipython = "^9.18.1"
pyyaml = "^6.0.3"
django-haystack = "^3.4.0"
celery-haystack = {git = "https://github.com/LeandroJatai/celery-haystack.git"}
pysolr = "^3.11.0"
pymupdf = "^2.1"
django-image-cropping = "^1.7"
easy-thumbnails = "^2.10"
pytz = "^2026.6"
djangorestframework = "^3.18.0"
django-filter = "^26.1"
drf-spectacular = "^0.30.0"
crispy-bootstrap5 = "^2026.9"
markdown = "^3.11.2"
django-braces = "^1.17.0"
num2words = "^0.5.14"
xlsxwriter = "^3.3.1"
python-docx = "^1.2.0"
weasyprint = "^70.0"
pandas = "^3.1.1"
python-magic = "^0.4.27"


[tool.poetry.group.dev.dependencies]
ruff = "^0.17.3"
jupyter = "^1.1.1"
django-debug-toolbar = "^8.0.0"
django-silk = "^5.6.0"

black = "^26.10.1"
isort = "^9.0.2"

[tool.poetry.group.test.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
pytest-django = "^4.14.0"
model-bakery = "^1.24.2"
django-webtest = "^1.9.15"

[tool.poetry.group.docs.dependencies]
sphinx = "9.1.1"
sphinxcontrib-django = "^2.5"


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
addopts = '--reuse-db -p no:warnings --cov=.'
testpaths = [
    "**/tests.py",
    "**/test_*.py"
]

[tool.coverage.run]
omit = [
    "_tests/*",
    "backend/settings/*",
    "backend/wsgi.py",
    "backend/asgi.py",
]

[tool.ruff.format]
quote-style = "single"